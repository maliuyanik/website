<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Seaflux Global</title>
    <meta name="description" content="Seaflux Global contact information, address, and contact form.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/x-icon" href="assets/images/icons/favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://www.seafluxglobal.com/contact.html">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="stylesheet" href="assets/fonts/montserrat.css">
    <script src="assets/js/tailwindcss.js"></script>
    <script src="assets/js/config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="assets/css/aos.css" rel="stylesheet">
</head>
<body class="font-sans bg-gray-50 text-gray-800 transition-colors duration-300">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Page Header -->
    <section class="relative h-[40vh] flex items-center justify-center bg-primary overflow-hidden">
        <div class="absolute inset-0 bg-black/40 z-10"></div>
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=1920" class="absolute inset-0 w-full h-full object-cover opacity-60">
        <div class="relative z-20 text-center text-white px-4" data-aos="fade-up">
            <h1 id="page-title" class="text-4xl md:text-5xl font-bold mb-4">İletişim</h1>
            <p id="page-desc" class="text-lg opacity-90 max-w-2xl mx-auto"></p>
        </div>
    </section>

    <!-- Contact Content -->
    <section class="py-20 bg-white">
        <div class="w-full px-6 md:px-12 lg:px-20" id="contact-container">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- Info -->
                <div data-aos="fade-right">
                    <h2 class="text-2xl font-bold text-primary mb-8">Merkez Ofis</h2>
                    <div class="space-y-6">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 bg-accent-500/10 rounded-full flex items-center justify-center text-accent-500"><i class="fa-solid fa-location-dot"></i></div>
                            <div><h3 class="font-bold text-gray-800">Adres</h3><p id="contact-address" class="text-gray-600"></p></div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 bg-accent-500/10 rounded-full flex items-center justify-center text-accent-500"><i class="fa-solid fa-phone"></i></div>
                            <div><h3 class="font-bold text-gray-800">Telefon</h3><p id="contact-phone" class="text-gray-600"></p></div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 bg-accent-500/10 rounded-full flex items-center justify-center text-accent-500"><i class="fa-solid fa-envelope"></i></div>
                            <div><h3 class="font-bold text-gray-800">E-posta</h3><p id="contact-email" class="text-gray-600"></p></div>
                        </div>
                    </div>
                </div>
                <!-- Map -->
                <div class="h-[400px] rounded-xl overflow-hidden shadow-lg" data-aos="fade-left">
                    <iframe id="contact-map" src="" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="assets/js/loader.js"></script>

    <script src="assets/js/aos.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
